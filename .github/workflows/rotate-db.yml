name: rotate-db
# Hourly ping of the Neon.new DB rotation endpoint. Vercel Hobby cron is
# limited to once per day — this workflow provides the real 2h-before-expiry
# cadence. Idempotent: shares the blob rotation lock with the Vercel cron and
# the in-app self-heal path, so duplicates are no-ops.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: ping rotation endpoint
        run: |
          curl -fsS --max-time 300 \
            "${{ vars.PROD_URL }}/api/cron/rotate-db" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"